version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    labels:
      - "type: dependency-upgrade"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "type: dependency-upgrade"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "tracebit-com/tracebit-community-action"
