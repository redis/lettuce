name: Release

on:
  release:
    types: [published]                                      # once a release is published in the GitHub UI
  workflow_dispatch:                                        # or manually, by clicking the button
    inputs:
      version:
        description: 'Version to publish for a manual run'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java with Maven cache

        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Update version in Maven configuration
        run: |
          ./mvnw --version
          ./mvnw --no-transfer-progress \
            --batch-mode \
            versions:set -DnewVersion="$RELEASE_VERSION"
        if: ${{ env.RELEASE_VERSION }}

      - name: Install GPG key

        run: |
          cat <(echo -e "${{ secrets.OSSH_GPG_SECRET_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Publish to Maven

        run: |
          ./mvnw --no-transfer-progress \
            --batch-mode \
            --settings .github/maven-settings.xml \
            -Dgpg.passphrase='${{ secrets.OSSH_GPG_SECRET_KEY_PASSWORD }}' \
            deploy -P sonatype-oss-release

        env:
          MAVEN_USERNAME: ${{secrets.OSSH_USERNAME}}
          MAVEN_PASSWORD: ${{secrets.OSSH_TOKEN}}
