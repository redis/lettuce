name: Benchmarks
on:
#  push:
#    paths-ignore:
#      - 'docs/**'
#      - '**/*.md'
#      - '**/*.rst'
#    branches:
#      - main
#      - '[0-9].*'
#  pull_request:
#    branches:
#      - main
#      - '[0-9].*'
  schedule:
    - cron: '0 1 * * *' # nightly build
  workflow_dispatch:

#permissions:
  # For commenting alerts on commits
  # contents: write

env:
  # Fork pull requests and Dependabot runs do not receive the Tracebit secret.
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:

  benchmark:
    name: Execute benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Setup Maven
        uses: s4u/setup-maven-action@v1.19.0
        with:
          java-version: 8
          java-distribution: temurin
      - name: Install missing dependencies to container
        run: |
          sudo apt update
      - name: Set up Docker Compose environment
        run: |
          mkdir -m 777 $REDIS_ENV_WORK_DIR
          make start
        env:
          REDIS_ENV_WORK_DIR: ${{ github.workspace }}/work
      - name: Maven offline
        run: |
          mvn -q dependency:go-offline
      - name: Run benchmarks
        run: |
          mvn -Pjmh clean test
        env:
          JVM_OPTS: -Xmx3200m
          TERM: dumb
      - name: Tear down Docker Compose environment
        run: |
          docker compose $COMPOSE_ENV_FILES -f src/test/resources/docker-env/docker-compose.yml down
      # Download previous benchmark result from cache (if exists)
      - name: Download previous benchmark data
        uses: actions/cache@v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark
      # Run `github-action-benchmark` action
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tool: 'jmh'
          auto-push: true
          gh-repository: 'github.com/redis/lettuce'
          gh-pages-branch: 'main'
          benchmark-data-dir-path: './docs/static/benchmarks'
          output-file-path: benchmarks.json
          fail-on-alert: false
          alert-threshold: '200%'
          alert-comment-cc-users: '@tishun'
          # comment-on-alert: true
