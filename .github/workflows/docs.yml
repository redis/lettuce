name: Publish Docs
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
env:
  # Fork pull requests and Dependabot runs do not receive the Tracebit secret.
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}
jobs:
  publish-docs:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions mkdocs-macros-plugin
          pip install -r requirements.txt
      - name: Build docs
        run: |
          mkdocs build -d docsbuild
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docsbuild'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
